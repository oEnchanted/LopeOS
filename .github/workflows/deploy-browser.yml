name: Deploy Lope Browser runtime

# The site deploy publishes the Browser app, but the hosted browser gateway and its
# Chromium worker image run separately on the Windows host. Reinstall them when
# their code changes, then gate on the real streaming acceptance test.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy-browser.yml
      - services/browser/**
      - packages/browser-client/**
      - services/runtime/browser-bridge.js
      - services/runtime/config.js
  workflow_dispatch:

permissions:
  contents: read

# Not the site deploy's lope-production group: GitHub keeps one pending run per
# group, so a site deploy queued behind another cancelled this one. The host has a
# single runner, which already runs the two deploys one at a time.
concurrency:
  group: lope-browser-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Reinstall and verify the browser runtime
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, lope-production]
    environment: production
    timeout-minutes: 45
    env:
      LOPE_SITE_ORIGIN: ${{ vars.LOPE_SITE_ORIGIN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the browser runtime and run the streaming test
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          if ([string]::IsNullOrWhiteSpace($env:LOPE_SITE_ORIGIN)) { throw 'Set LOPE_SITE_ORIGIN in the production environment variables.' }
          $source = Join-Path 'M:/LopeOS/browser-setup' ('deploy-' + [Guid]::NewGuid().ToString('N'))
          New-Item -ItemType Directory -Force -Path $source | Out-Null
          # Keep downloads and test browsers off C:, which is nearly full on this host.
          $env:TEMP = Join-Path $source 'temp'; $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:TEMP | Out-Null
          try {
            # Read-only host report, so stream tuning can match the real CPU, memory and display adapter.
            $system = Get-CimInstance Win32_ComputerSystem
            $adapters = (Get-CimInstance Win32_VideoController | ForEach-Object { $_.Name }) -join ', '
            $linux = ((& wsl.exe --distribution 'Ubuntu-24.04' --user root --exec sh -c 'echo cpus=$(nproc) mem=$(free -m | awk "/Mem:/{print \$2}")MB; ls /usr/lib/wsl/drivers 2>/dev/null | head -5 | tr "\n" " "') -join ' ')
            Write-Output ("::notice title=Browser host resources::Windows logical CPUs=" + $system.NumberOfLogicalProcessors + " RAM=" + [math]::Round($system.TotalPhysicalMemory / 1GB, 1) + "GB adapters=[" + $adapters + "] WSL " + $linux)
            # Fetch only the reviewed runtime files for this exact commit.
            $base = "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA"
            $manifest = Invoke-RestMethod -Uri "$base/services/browser/hosting/windows/runtime-files.json"
            foreach ($file in $manifest) {
              if ($file -match '\.\.' -or $file -notmatch '^(services/browser/(src|infra|hosting)/|packages/browser-client/src/|services/runtime/(browser-bridge|config)\.js$)') { throw 'Invalid runtime source manifest.' }
              $target = Join-Path $source $file
              New-Item -ItemType Directory -Force -Path (Split-Path $target) | Out-Null
              Invoke-WebRequest -UseBasicParsing -Uri "$base/$file" -OutFile $target
            }
            & (Join-Path $source 'services/browser/hosting/windows/Install-LopeBrowser.ps1') -SiteOrigin $env:LOPE_SITE_ORIGIN -Distro 'Ubuntu-24.04' -InstallRoot 'M:/LopeOS/browser' -DataRoot 'M:/LopeOS/browser-host-data' -MaxWorkers 5
            $smoke = Join-Path $source 'smoke-dependencies'
            $env:PLAYWRIGHT_BROWSERS_PATH = Join-Path $smoke 'browsers'
            & npm.cmd install --prefix $smoke --no-audit --no-fund --ignore-scripts --package-lock=false playwright@1.65.0
            if ($LASTEXITCODE -ne 0) { throw 'Could not prepare the streaming test client.' }
            & node (Join-Path $smoke 'node_modules/playwright/cli.js') install chromium-headless-shell
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the streaming test browser.' }
            $env:LOPE_BROWSER_SMOKE_PLAYWRIGHT = Join-Path $smoke 'node_modules/playwright/index.mjs'
            $env:LOPE_BROWSER_WSL_DISTRO = 'Ubuntu-24.04'
            $smokeOutput = @(& node (Join-Path $source 'services/browser/hosting/windows/smoke-stream.mjs'))
            $smokeExit = $LASTEXITCODE
            $smokeOutput | Write-Output
            # The result line holds only the stage and pass/fail checks; an annotation shows it without the log.
            $smokeResult = $smokeOutput | Where-Object { $_ -like '{"kind":"lope-browser-stream-smoke"*' } | Select-Object -Last 1
            if ($smokeExit -ne 0) { Write-Output "::error title=Streaming smoke test::$smokeResult"; throw 'The streaming acceptance test failed on the production host.' }
            $health = Invoke-WebRequest -UseBasicParsing -Uri "$env:LOPE_SITE_ORIGIN/api/browser/health" -TimeoutSec 15
            if ($health.StatusCode -ne 200) { throw 'The public browser route is not healthy.' }
            Write-Output 'Browser runtime deployed and verified.'
          } catch {
            Write-Output ("::error title=Browser deploy failed::" + ($_.Exception.Message -replace '\r?\n', ' '))
            throw
          } finally {
            if (Test-Path $source) { Remove-Item $source -Recurse -Force }
          }
