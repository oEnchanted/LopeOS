# Read-only: how account sync, Caddy, and the deploy runner behave across a Windows restart.
# Dispatched manually on a temporary branch. Never deploys or changes the host.
name: Inspect LopeOS restart behavior
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 10
    steps:
      - name: Inspect boot history, account service log, scheduled tasks, and runner
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Output "Now: $((Get-Date).ToString('o'))  Last boot: $((Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToString('o'))"
          Write-Output "C: free GiB: $([math]::Round((Get-Volume -DriveLetter C).SizeRemaining / 1GB, 2))"
          Write-Output '--- Recent boots and shutdowns (System log 6005/6006/6008/1074)'
          Get-WinEvent -FilterHashtable @{ LogName = 'System'; Id = 6005, 6006, 6008, 1074 } -MaxEvents 12 -ErrorAction SilentlyContinue | ForEach-Object { "$($_.TimeCreated.ToString('s')) id=$($_.Id) $(($_.Message -split "`n")[0].Trim())" }
          Write-Output '--- LopeOS Accounts task'
          $task = Get-ScheduledTask -TaskName 'LopeOS Accounts' -ErrorAction SilentlyContinue
          if ($task) {
            $info = $task | Get-ScheduledTaskInfo
            Write-Output "State=$($task.State) LastRun=$($info.LastRunTime.ToString('s')) LastResult=$($info.LastTaskResult) Triggers=$(($task.Triggers | ForEach-Object { $_.CimClass.CimClassName }) -join ',') Restart=$($task.Settings.RestartCount)x$($task.Settings.RestartInterval) MultipleInstances=$($task.Settings.MultipleInstances)"
          }
          Write-Output '--- Task Scheduler history for LopeOS Accounts (last 30 events)'
          Get-WinEvent -LogName 'Microsoft-Windows-TaskScheduler/Operational' -MaxEvents 4000 -ErrorAction SilentlyContinue | Where-Object { $_.Message -like '*LopeOS Accounts*' } | Select-Object -First 30 | ForEach-Object { "$($_.TimeCreated.ToString('s')) id=$($_.Id) $(($_.Message -split "`n")[0].Trim())" }
          Write-Output '--- Account service log (last 60 lines)'
          Get-Content -LiteralPath 'C:\LopeOS\accounts\logs\service.log' -Tail 60 -ErrorAction SilentlyContinue
          Write-Output '--- Account storage lock'
          $lock = 'C:\LopeOS\accounts-data\.lock'
          if (Test-Path -LiteralPath $lock) { $lockPid = (Get-Content -LiteralPath $lock -Raw).Trim(); $owner = Get-CimInstance Win32_Process -Filter "ProcessId=$lockPid" -ErrorAction SilentlyContinue; Write-Output "lock pid=$lockPid owner=$($owner.Name) started=$($owner.CreationDate) cmd=$($owner.CommandLine)" } else { Write-Output 'no lock file' }
          Write-Output '--- Deploy runner processes and services'
          Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | ForEach-Object { $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)" -ErrorAction SilentlyContinue; "pid=$($_.ProcessId) started=$($_.CreationDate) path=$($_.ExecutablePath) parent=$($parent.Name) $($parent.CommandLine)" }
          Get-CimInstance Win32_Service | Where-Object { $_.Name -like 'actions.runner*' -or $_.Name -eq 'caddy' } | ForEach-Object { "$($_.Name) state=$($_.State) start=$($_.StartMode) account=$($_.StartName) path=$($_.PathName)" }
          Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.Actions.Execute -match 'run\.cmd|Runner|actions' -or $_.TaskName -match 'runner' } | ForEach-Object { "task $($_.TaskName) state=$($_.State) user=$($_.Principal.UserId)" }
          $autologon = Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon' -ErrorAction SilentlyContinue
          Write-Output "AutoAdminLogon=$($autologon.AutoAdminLogon)"
          Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup", 'C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp' -ErrorAction SilentlyContinue | ForEach-Object { "startup item: $($_.FullName)" }
