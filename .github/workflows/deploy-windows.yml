# Read-only: which account and rights the LopeOS runner has after the restart.
name: Check LopeOS runner identity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 5
    steps:
      - name: Show runner account, elevation, boot time, and service health
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Output "account=$($id.Name) admin=$(([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator))"
          Write-Output "lastBoot=$((Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToString('o')) now=$((Get-Date).ToString('o'))"
          foreach ($url in 'https://lopeos.online/api/accounts/session', 'https://lopeos.online/__lope/version.json', 'https://benjaminsuitts.com/') { try { $r = Invoke-WebRequest -UseBasicParsing -Uri $url -TimeoutSec 10; Write-Output "$url -> $($r.StatusCode)" } catch { Write-Output "$url -> $($_.Exception.Message)" } }
