name: Deploy LopeOS to Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lope-production
  cancel-in-progress: false

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install locked dependencies
        run: npx --yes pnpm@10.32.1 install --frozen-lockfile
      # pnpm blocks dependency scripts by default, and node-pty has no Linux
      # prebuild. Build only the native dependency needed by the PTY tests.
      - name: Build the Linux PTY test dependency
        run: npm rebuild node-pty --prefix services/runtime
      - name: Run unit and transport tests
        run: npm test
      - name: Build the production desktop
        run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: lope-dist
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  deploy:
    name: Publish the tested desktop
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, lope-production]
    environment: production
    timeout-minutes: 15
    env:
      LOPE_SITE_ORIGIN: ${{ vars.LOPE_SITE_ORIGIN }}
      LOPE_RELEASE_PATH: C:/LopeOS/releases/${{ github.run_id }}-${{ github.run_attempt }}
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check host deployment configuration
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:LOPE_SITE_ORIGIN)) {
            throw 'Set LOPE_SITE_ORIGIN in the production environment variables.'
          }
          if (-not (Test-Path -LiteralPath 'C:/LopeOS/deploy/Deploy-LopeFrontend.ps1' -PathType Leaf)) {
            throw 'Install the host deployment script before running this workflow.'
          }
      # The production runner receives only the built site. Its publishing
      # script and Caddy configuration are provisioned separately on the host.
      - uses: actions/download-artifact@v8
        with:
          name: lope-dist
          path: ${{ env.LOPE_RELEASE_PATH }}
          digest-mismatch: error
      - name: Activate the complete release
        run: |
          $ErrorActionPreference = 'Stop'
          $deployParameters = @{
            ReleasePath = $env:LOPE_RELEASE_PATH
            SiteOrigin = $env:LOPE_SITE_ORIGIN
            CaddyExe = 'C:/Caddy/caddy.exe'
            Caddyfile = 'C:/Caddy/Caddyfile'
            CaddyTemplate = 'C:/Caddy/Caddyfile.template'
            SharedAssetsPath = 'C:/LopeOS/shared/assets'
          }
          & 'C:/LopeOS/deploy/Deploy-LopeFrontend.ps1' @deployParameters
