# Temporary, read-only: why nothing answers on 127.0.0.1:4174 (visitor workspace runtime).
name: Inspect visitor workspace runtime
on:
  push:
    branches: [claude/workspace-runtime-20261114]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 15
    steps:
      - name: Inspect runtime host
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $env:WSL_UTF8 = '1'
          $out = New-Object System.Collections.Generic.List[string]
          function Add([string]$t) { $out.Add(($t -replace "`0", '')) }
          Add "identity=$([Security.Principal.WindowsIdentity]::GetCurrent().Name) boot=$((Get-CimInstance Win32_OperatingSystem).LastBootUpTime.ToString('s'))"
          Add "--- wsl -l -v"; Add ((& wsl.exe --list --verbose 2>&1) -join "`n")
          Add "--- tasks"
          Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -like '*Lope*' } | ForEach-Object { $i = $_ | Get-ScheduledTaskInfo; Add "$($_.TaskName) state=$($_.State) user=$($_.Principal.UserId) logon=$($_.Principal.LogonType) last=$($i.LastRunTime.ToString('s')) result=$($i.LastTaskResult) action=$($_.Actions.Execute) $($_.Actions.Arguments)" }
          Add "--- listeners"
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 443,4174,4176,4177 } | ForEach-Object { Add "$($_.LocalAddress):$($_.LocalPort) $((Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName)" }
          Add "--- caddy api routes"; Add ((Select-String -Path 'M:\Caddy\Caddyfile' -Pattern 'handle|reverse_proxy' -ErrorAction SilentlyContinue | ForEach-Object { $_.Line.Trim() }) -join "`n")
          $probe = @'
          echo "distro=$WSL_DISTRO_NAME pid1=$(ps -p 1 -o comm=) systemd=$(systemctl is-system-running 2>&1)"
          echo "node=$(node -v 2>&1) docker=$(docker version --format '{{.Server.Version}}' 2>&1)"
          echo "runtimes=$(docker info --format '{{json .Runtimes}}' 2>&1 | head -c 600)"
          echo "images: $(docker image ls --format '{{.Repository}}:{{.Tag}}' 2>&1 | tr '\n' ' ')"
          echo "containers: $(docker ps -a --format '{{.Names}}={{.Status}}' 2>&1 | head -20 | tr '\n' ' ')"
          ls -la /opt/lopeos-runtime 2>&1 | head -8
          ls /etc/lopeos 2>&1; grep -v -i -E 'secret|token|key' /etc/lopeos/visitors.env 2>&1
          echo "unit: $(systemctl is-enabled lope-visitor-runtime 2>&1) $(systemctl is-active lope-visitor-runtime 2>&1)"
          journalctl -u lope-visitor-runtime --no-pager -n 40 -o cat 2>&1 | tail -40
          df -h / /var/lib/lopeos 2>&1
          ls /var/lib/lopeos 2>&1 | head; ls /var/lib/lopeos/images 2>&1 | wc -l
          curl -s -m 5 -i http://127.0.0.1:4174/api/health 2>&1 | head -3
          '@
          foreach ($d in @('Ubuntu', 'Ubuntu-24.04')) {
            Add "=== distro $d"
            $file = Join-Path $env:RUNNER_TEMP 'probe.sh'; [IO.File]::WriteAllText($file, $probe.Replace("`r", ''), (New-Object Text.UTF8Encoding($false)))
            $lin = ((& wsl.exe --distribution $d --user root --exec wslpath -a $file) -join '').Trim()
            Add ((& wsl.exe --distribution $d --user root --exec bash $lin 2>&1) -join "`n")
          }
          try { Add "win->4174: $((Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4174/api/health' -TimeoutSec 5).StatusCode)" } catch { Add "win->4174: $($_.Exception.Message)" }
          $text = ($out -join "`n")
          Write-Output $text
          $esc = $text.Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          for ($i = 0; $i -lt $esc.Length -and $i -lt 36000; $i += 3800) { Write-Output "::warning title=diag $i::$($esc.Substring($i, [Math]::Min(3800, $esc.Length - $i)))" }
