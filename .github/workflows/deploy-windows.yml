# Temporary manual workflow: move LopeOS, Portfolio, and Caddy from C: to M:.
# Dispatched on a temporary branch; dry_run prints the plan without changes.
name: Move LopeOS, Portfolio, and Caddy to M
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, change nothing
        type: boolean
        default: true
      steps:
        description: Steps to run
        type: string
        default: copy,accounts,portfolio,caddy
permissions:
  contents: read
jobs:
  move:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 45
    steps:
      - name: Move services to M
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          MOVE_STEPS: ${{ inputs.steps }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $script = Join-Path $env:RUNNER_TEMP 'Move-ServicesToM.ps1'
          Invoke-WebRequest -UseBasicParsing -Uri "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/$env:GITHUB_SHA/.github/move/Move-ServicesToM.ps1" -OutFile $script
          $syntax = $null
          [Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$syntax) | Out-Null
          if ($syntax.Count) { $syntax | ForEach-Object { "line $($_.Extent.StartLineNumber): $($_.Message)" }; throw 'The move script has syntax errors; nothing was changed.' }
          & $script -DryRun:($env:DRY_RUN -eq 'true') -Steps $env:MOVE_STEPS
