# Read-only host diagnostics for the missing workspace runtime (502 on /api/*).
# Dispatched manually on a temporary branch. Never deploys or changes the host.
name: Inspect LopeOS runtime host
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 15
    steps:
      - name: Inspect disk, releases, reboot state, WSL, and runtime listener
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $env:WSL_UTF8 = '1'
          function Size([string]$Path) {
            if (-not (Test-Path -LiteralPath $Path)) { return $null }
            $sum = (Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            [math]::Round(($sum / 1GB), 3)
          }
          $os = Get-CimInstance Win32_OperatingSystem
          $report = [ordered]@{}
          $report.identity = [Security.Principal.WindowsIdentity]::GetCurrent().Name
          $report.admin = ([Security.Principal.WindowsPrincipal][Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $report.lastBoot = $os.LastBootUpTime.ToString('o')
          $report.memoryGiB = [math]::Round($os.TotalVisibleMemorySize / 1MB, 1)
          $report.volumes = @(Get-Volume | Where-Object { $_.DriveType -eq 'Fixed' -and $_.DriveLetter } | ForEach-Object { [ordered]@{ drive = "$($_.DriveLetter):"; freeGiB = [math]::Round($_.SizeRemaining / 1GB, 2); sizeGiB = [math]::Round($_.Size / 1GB, 2) } })
          $report.rebootPending = [ordered]@{
            componentServicing = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending'
            windowsUpdate = Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired'
            fileRenames = [bool](Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue)
          }
          $report.features = @(Get-WindowsOptionalFeature -Online -FeatureName Microsoft-Windows-Subsystem-Linux, VirtualMachinePlatform -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FeatureName)=$($_.State)" })
          $report.wslStatus = ((& wsl.exe --status 2>&1) -join ' ').Trim()
          $report.wslList = ((& wsl.exe --list --verbose 2>&1) -join ' ').Trim()
          $report.listeners = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -in 443, 4174, 4176 } | ForEach-Object { "$($_.LocalAddress):$($_.LocalPort) pid=$($_.OwningProcess) $((Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).ProcessName)" })
          $report.lopeTasks = @(Get-ScheduledTask -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -like '*Lope*' } | ForEach-Object { "$($_.TaskName) state=$($_.State) user=$($_.Principal.UserId)" })
          $report.services = @(Get-Service -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'caddy|actions\.runner|docker|wsl|LxssManager' } | ForEach-Object { "$($_.Name) $($_.Status) $($_.StartType)" })
          $report.caddyRoots = @(Select-String -Path 'C:\Caddy\Caddyfile' -Pattern 'root \* "([^"]+)"' -ErrorAction SilentlyContinue | ForEach-Object { $_.Matches[0].Groups[1].Value } | Sort-Object -Unique)
          $report.releases = @(Get-ChildItem -LiteralPath 'C:\LopeOS\releases' -Directory -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | ForEach-Object { "$($_.Name) $($_.LastWriteTime.ToString('s')) $(Size $_.FullName)GiB" })
          $report.sizesGiB = [ordered]@{}
          foreach ($path in @('C:\LopeOS\releases', 'C:\LopeOS\shared', 'C:\LopeOS\accounts', 'C:\LopeOS\accounts-data', 'C:\actions-runner-LopeOS', 'C:\Caddy', 'C:\Windows\Temp', 'C:\Windows\SoftwareDistribution\Download', 'C:\ProgramData\Package Cache', 'M:\LopeOS')) { $report.sizesGiB[$path] = Size $path }
          $report.userTemps = @(Get-ChildItem 'C:\Users' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $t = Join-Path $_.FullName 'AppData\Local\Temp'; if (Test-Path $t) { "$($_.Name) temp=$(Size $t)GiB" } })
          $report.pageAndHiberGiB = @(Get-ChildItem 'C:\' -Force -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match 'pagefile|hiberfil|swapfile' } | ForEach-Object { "$($_.Name)=$([math]::Round($_.Length / 1GB, 2))" })
          $report.topLevelC = @(Get-ChildItem 'C:\' -Directory -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -notin 'Windows', 'Users', 'Program Files', 'Program Files (x86)', 'ProgramData', '$Recycle.Bin', 'System Volume Information', 'Recovery' } | ForEach-Object { "$($_.Name)=$(Size $_.FullName)GiB" })
          $report.recycleBinGiB = Size 'C:\$Recycle.Bin'
          try { $report.runtimeHealth = (Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:4174/api/health' -TimeoutSec 5).StatusCode } catch { $report.runtimeHealth = if ($_.Exception.Response) { [int]$_.Exception.Response.StatusCode } else { $_.Exception.Message } }
          $report | ConvertTo-Json -Depth 5
