# Read-only survey before moving LopeOS, Portfolio, Caddy, and the runners from C: to M:.
# Dispatched manually on a temporary branch. Prints paths and settings only.
name: Survey host before moving services to M
on: workflow_dispatch
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 15
    steps:
      - name: Survey M drive, Caddy sites, Portfolio, runners, and C path references
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          function Size([string]$Path) { if (Test-Path -LiteralPath $Path) { [math]::Round(((Get-ChildItem -LiteralPath $Path -Recurse -Force -File -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum / 1GB), 3) } }
          Write-Output '=== M: volume and disk'
          $volume = Get-Volume -DriveLetter M
          Write-Output "fs=$($volume.FileSystem) type=$($volume.DriveType) freeGiB=$([math]::Round($volume.SizeRemaining/1GB,2)) label=$($volume.FileSystemLabel)"
          $partition = Get-Partition -DriveLetter M
          $disk = Get-Disk -Number $partition.DiskNumber
          Write-Output "disk=$($disk.Number) bus=$($disk.BusType) model=$($disk.FriendlyName) location=$($disk.Location) bootDisk=$($disk.IsBoot) systemDisk=$($disk.IsSystem) removable=$((Get-CimInstance Win32_DiskDrive | Where-Object Index -eq $disk.Number).MediaType)"
          Write-Output "C: disk=$((Get-Partition -DriveLetter C).DiskNumber) bus=$((Get-Disk -Number (Get-Partition -DriveLetter C).DiskNumber).BusType)"
          Write-Output "M: root ACL:"; (Get-Acl M:\).Access | ForEach-Object { "  $($_.IdentityReference) $($_.FileSystemRights) $($_.AccessControlType) inherit=$($_.InheritanceFlags)" }
          Write-Output "M: top level:"; Get-ChildItem M:\ -Force -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name)" }

          Write-Output '=== Caddy'
          Get-CimInstance Win32_Service -Filter "Name='caddy'" | ForEach-Object { "service state=$($_.State) start=$($_.StartMode) account=$($_.StartName) path=$($_.PathName)" }
          Get-ChildItem 'C:\caddy' -Force | ForEach-Object { "  C:\caddy\$($_.Name) $($_.Length)" }
          Write-Output 'Caddyfile structure (site blocks, roots, proxies, global options):'
          $n = 0
          foreach ($line in Get-Content -LiteralPath 'C:\caddy\Caddyfile') { $n++; if ($line -match '^\S.*\{\s*$|^\s*(root|reverse_proxy|file_server|import|admin|storage|handle(_path)?|route|try_files)\b|^\{|^\}') { Write-Output ("  {0,4}: {1}" -f $n, ($line -replace '(?i)(token|secret|password|key|auth)\S*.*$', '$1 [redacted]')) } }
          foreach ($profile in @('C:\Windows\System32\config\systemprofile\AppData\Roaming\Caddy', 'C:\Windows\System32\config\systemprofile\AppData\Local\Caddy')) { Write-Output "caddy data $profile = $(Size $profile) GiB" }

          Write-Output '=== Portfolio and sites'
          Get-ChildItem 'C:\sites' -Force | ForEach-Object { "  C:\sites\$($_.Name) $(Size $_.FullName) GiB" }
          if (Test-Path 'C:\sites\portfolio-backend\host.json') { Write-Output "backend host.json keys: $(((Get-Content 'C:\sites\portfolio-backend\host.json' -Raw | ConvertFrom-Json).PSObject.Properties | ForEach-Object { if ($_.Name -in 'root','host','redirectsPath','statePath','logPath','diskDir') { "$($_.Name)=$($_.Value)" } else { $_.Name } }) -join '; ')" }
          foreach ($path in 'C:\sites\portfolio', 'C:\sites\portfolio-backend', 'C:\sites\portfolio-backend\logs') { if (Test-Path $path) { Write-Output "ACL $path"; (Get-Acl $path).Access | ForEach-Object { "  $($_.IdentityReference) $($_.FileSystemRights) $($_.AccessControlType) inherited=$($_.IsInherited)" } } }
          Write-Output 'C:\Portfolio:'; Get-ChildItem 'C:\Portfolio' -Force -ErrorAction SilentlyContinue | ForEach-Object { "  $($_.Name) $(if ($_.PSIsContainer) { Size $_.FullName })" }
          if (Test-Path 'C:\Portfolio\.git\config') { Select-String -LiteralPath 'C:\Portfolio\.git\config' -Pattern 'url\s*=' | ForEach-Object { "  git $($_.Line.Trim() -replace 'https://[^@]+@', 'https://')" } }

          Write-Output '=== Runners'
          foreach ($root in 'C:\actions-runner', 'C:\actions-runner-LopeOS\actions-runner', 'C:\action-runner-LopeOS') {
            if (Test-Path $root) {
              $runner = Get-Content (Join-Path $root '.runner') -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json -ErrorAction SilentlyContinue
              Write-Output "$root size=$(Size $root) GiB name=$($runner.agentName) pool=$($runner.poolName) work=$($runner.workFolder) url=$($runner.gitHubUrl) service=$((Get-Content (Join-Path $root '.service') -ErrorAction SilentlyContinue))"
              Get-ChildItem $root -Force | Where-Object { $_.PSIsContainer } | ForEach-Object { "  $($_.Name) $(Size $_.FullName) GiB" }
              Write-Output "  ACL:"; (Get-Acl $root).Access | ForEach-Object { "    $($_.IdentityReference) $($_.FileSystemRights) inherited=$($_.IsInherited)" }
            }
          }
          Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe' OR Name='Runner.Listener.exe' OR Name='RunnerService.exe'" | ForEach-Object { "proc $($_.Name) pid=$($_.ProcessId) $($_.ExecutablePath)" }

          Write-Output '=== Everything on C: that a task, service, or process runs from (outside Windows and Program Files)'
          $skip = '^"?C:\\(Windows|Program Files|ProgramData\\Microsoft)'
          Get-ScheduledTask | ForEach-Object { $t = $_; foreach ($a in $t.Actions) { if ("$($a.Execute) $($a.Arguments) $($a.WorkingDirectory)" -match 'C:\\' -and $a.Execute -notmatch $skip) { "task '$($t.TaskName)' state=$($t.State) user=$($t.Principal.UserId) exe=$($a.Execute) args=$($a.Arguments) cwd=$($a.WorkingDirectory)" } } }
          Get-CimInstance Win32_Service | Where-Object { $_.PathName -match 'C:\\' -and $_.PathName -notmatch $skip } | ForEach-Object { "service $($_.Name) state=$($_.State) start=$($_.StartMode) account=$($_.StartName) path=$($_.PathName)" }
          Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -match '^C:\\' -and $_.ExecutablePath -notmatch $skip } | ForEach-Object { "process $($_.Name) pid=$($_.ProcessId) $($_.ExecutablePath)" } | Sort-Object -Unique
          Write-Output '=== Listening ports'
          Get-NetTCPConnection -State Listen | Where-Object { $_.LocalAddress -in '0.0.0.0', '::', '127.0.0.1', '::1' } | Sort-Object LocalPort -Unique | ForEach-Object { "  $($_.LocalAddress):$($_.LocalPort) $((Get-Process -Id $_.OwningProcess -ErrorAction SilentlyContinue).Path)" }
          Write-Output '=== C:\LopeOS breakdown'
          Get-ChildItem 'C:\LopeOS' -Force | ForEach-Object { "  $($_.Name) $(if ($_.PSIsContainer) { Size $_.FullName } else { $_.Length })" }
          Get-ChildItem 'C:\LopeOS\deploy' -Force -ErrorAction SilentlyContinue | ForEach-Object { "  deploy\$($_.Name)" }
          Write-Output "C: free GiB: $([math]::Round((Get-Volume -DriveLetter C).SizeRemaining/1GB,2))"
