# Temporary read-only check of the LopeOS runner switch.
name: Check LopeOS runner switch
on: workflow_dispatch
permissions:
  contents: read
jobs:
  check:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 5
    steps:
      - name: Show switch log and runner origin
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Continue'
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          Write-Output "job runs as $($id.Name) admin=$(([Security.Principal.WindowsPrincipal]$id).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) workspace=$env:GITHUB_WORKSPACE"
          Get-Content 'M:\HostMaintenance\lopeos-runner-switch.log'
          foreach ($p in Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'") { $parent = Get-CimInstance Win32_Process -Filter "ProcessId=$($p.ParentProcessId)"; "listener pid=$($p.ProcessId) session=$($p.SessionId) $($p.ExecutablePath) owner=$((Invoke-CimMethod -InputObject $p -MethodName GetOwner).User) parent=$($parent.Name) $($parent.CommandLine)" }
          Get-ScheduledTask -TaskName 'LopeOS GitHub runner' | ForEach-Object { "task $($_.State) $($_.Principal.UserId) logon=$($_.Principal.LogonType) level=$($_.Principal.RunLevel)" }
          Get-CimInstance Win32_Service | Where-Object { $_.Name -like 'actions.runner*' } | ForEach-Object { "service $($_.Name) $($_.State) $($_.StartMode) $($_.PathName)" }
          Unregister-ScheduledTask -TaskName 'LopeOS runner switch' -Confirm:$false -ErrorAction SilentlyContinue
