# Temporary maintenance: keep LopeOS job temp files and caches on M: instead of C:.
name: Redirect temp and caches to M
on: workflow_dispatch
permissions:
  contents: read
jobs:
  redirect:
    runs-on: [self-hosted, Windows, X64, lope-production]
    timeout-minutes: 15
    steps:
      - name: Point temp folders and caches at M
        shell: powershell -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          Write-Output ("Before: C: {0:N2} GiB free, M: {1:N2} GiB free" -f ((Get-Volume -DriveLetter C).SizeRemaining / 1GB), ((Get-Volume -DriveLetter M).SizeRemaining / 1GB))

          # 1. The administrator runner account (LopeOS runner, browser gateway, WSL tools).
          $userTemp = 'M:\LopeOS\temp\runner'; $userNpm = 'M:\LopeOS\cache\npm'
          New-Item -ItemType Directory -Force -Path $userTemp, $userNpm | Out-Null
          foreach ($name in 'TEMP', 'TMP') { [Environment]::SetEnvironmentVariable($name, $userTemp, 'User') }
          [Environment]::SetEnvironmentVariable('npm_config_cache', $userNpm, 'User')
          Write-Output "User TEMP/TMP -> $userTemp; npm cache -> $userNpm (applies to processes started from now on)"

          # 2. The Portfolio runner service (NETWORK SERVICE) reads job variables from its .env file.
          $portfolio = 'M:\actions-runner-Portfolio'
          $portfolioTemp = Join-Path $portfolio '_ostemp'; $portfolioNpm = Join-Path $portfolio '_npm-cache'
          New-Item -ItemType Directory -Force -Path $portfolioTemp, $portfolioNpm | Out-Null
          $envFile = Join-Path $portfolio '.env'
          $lines = @(if (Test-Path -LiteralPath $envFile) { Get-Content -LiteralPath $envFile | Where-Object { $_ -notmatch '^(TEMP|TMP|npm_config_cache)=' } })
          $lines += "TEMP=$portfolioTemp", "TMP=$portfolioTemp", "npm_config_cache=$portfolioNpm"
          [IO.File]::WriteAllLines($envFile, [string[]]$lines, [Text.UTF8Encoding]::new($false))
          $service = 'actions.runner.oEnchanted-Portfolio.portfolio-windows'
          $busy = @(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'" | Where-Object { $_.ExecutablePath -like "$portfolio\*" }).Count
          if ($busy) { Write-Output 'Portfolio runner is busy; its new temp folder applies after its next restart.' }
          else { Restart-Service -Name $service; Start-Sleep -Seconds 15; Write-Output "Portfolio runner restarted: $((Get-Service -Name $service).Status)" }

          # 3. Restart the LopeOS runner after this job so it starts with the new variables.
          $helper = @'
          $deadline = (Get-Date).AddMinutes(15)
          while ((Get-Date) -lt $deadline -and @(Get-CimInstance Win32_Process -Filter "Name='Runner.Worker.exe'" | Where-Object { $_.ExecutablePath -like 'M:\actions-runner-LopeOS\*' }).Count) { Start-Sleep -Seconds 2 }
          Get-CimInstance Win32_Process -Filter "Name='cmd.exe'" | Where-Object { $_.CommandLine -like '*actions-runner-LopeOS*run*.cmd*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Get-CimInstance Win32_Process -Filter "Name='Runner.Listener.exe'" | Where-Object { $_.ExecutablePath -like 'M:\actions-runner-LopeOS\*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Start-Sleep -Seconds 3
          Start-ScheduledTask -TaskName 'LopeOS GitHub runner'
          '@
          $script = 'M:\HostMaintenance\Restart-LopeRunner.ps1'
          [IO.File]::WriteAllText($script, $helper)
          $action = New-ScheduledTaskAction -Execute 'powershell.exe' -Argument "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$script`""
          $system = New-ScheduledTaskPrincipal -UserId 'S-1-5-18' -LogonType ServiceAccount -RunLevel Highest
          Register-ScheduledTask -TaskName 'LopeOS runner restart' -Action $action -Trigger (New-ScheduledTaskTrigger -Once -At (Get-Date).AddSeconds(15)) -Principal $system -Settings (New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 20)) -Force | Out-Null
          Write-Output 'LopeOS runner will restart after this job finishes.'
